# Configuration for Release Drafter: https://github.com/release-drafter/release-drafter
name-template: $RESOLVED_VERSION
tag-template: cyclonedx-maven-plugin-$RESOLVED_VERSION
version-template: $MAJOR.$MINOR.$PATCH

# Bump the version based on the labels of the merged pull requests
version-resolver:
  major:
    labels:
      - breaking
  minor:
    labels:
      - major-enhancement
      - major-rfe
      - enhancement
      - feature
      - rfe
  default: patch

categories:
  - title: 💥 Breaking changes
    labels:
      - breaking
  - title: 🚨 Removed
    labels:
      - removed
  - title: 🎉 Major features and improvements
    labels:
      - major-enhancement
      - major-rfe
  - title: 🐛 Major bug fixes
    labels:
      - major-bug
  - title: ⚠️ Deprecated
    labels:
      - deprecated
  - title: 🚀 New features and improvements
    labels:
      - enhancement
      - feature
      - rfe
  - title: 🐛 Bug Fixes
    labels:
      - bug
      - fix
      - bugfix
      - regression
  - title: 👷 Changes for plugin developers
    labels:
      - developer
  # Default label used by Dependabot
  - title: 📦 Dependency updates
    labels:
      - dependencies
      - dependency
      - dependency-upgrade
  - title: 📝 Documentation updates
    labels:
      - documentation
  - title: 👻 Maintenance
    labels:
      - chore
      - internal
      - maintenance
  - title: 🔧 Build
    labels:
      - build
  - title: 🚦 Tests
    labels:
      - test
      - tests

exclude-labels:
  - reverted
  - no-changelog
  - skip-changelog
  - invalid

# Label pull requests automatically based on the files they touch
autolabeler:
  - label: documentation
    files:
      - '**/*.md'
      - 'src/site/**'
  - label: tests
    files:
      - 'src/test/**'
      - 'src/it/**'
  - label: build
    files:
      - '.github/**'
      - 'release.sh'

change-template: '- $TITLE ([#$NUMBER]($URL)) @$AUTHOR'

template: |
  <!-- Optional: add a release summary here -->
  $CHANGES

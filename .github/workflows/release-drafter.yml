name: Release Drafter
on:
  push:
    branches:
      - master
  # pull_request_target runs the autolabeler on PRs from forks (config-only, no PR code is checked out)
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  update_release_draft:
    permissions:
      # write permission is required to create a github release
      contents: write
      # write permission is required for the autolabeler
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@72967cdc98ddd3160f1fc3dff619de365e137dd0 # v7.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
